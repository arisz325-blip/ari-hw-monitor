name: Watchlist fast check

# Runs much more often than the full hourly scan, but only checks the small
# stock_probe.watchlist list (one request per item — no collection scan, no
# sitemap). Point of this: catch a watchlisted car going on sale within
# minutes instead of up to an hour. Shares check.yml's concurrency group on
# purpose, so the two never race writing state.json/docs/data.json — during
# the ~15-20 min the full scan takes, this queues rather than overlapping.
# GitHub's scheduler doesn't guarantee the exact minute for either workflow
# on the free tier, so treat "every 5 minutes" as "roughly every 5 minutes".

on:
  # Intended driver: a cron trigger on the Cloudflare Worker, since GitHub's
  # own scheduler is best-effort and measured at a 32-minute median here (94
  # runs, all successful, gaps 20–117 min) against the 5 it asks for.
  # As of 2026-08-24 the Worker's cron never fires — see the long note in
  # worker/watchlist-worker.js — so nothing dispatches this and the schedule
  # below is what actually runs, at roughly 30-40 minute intervals.
  repository_dispatch:
    types: [watchlist-check]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-wheels-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # This run may sit queued behind check.yml (same concurrency group,
      # and that one can take ~15-20 min) before it actually starts. A plain
      # checkout pins to the commit that existed when this run was
      # *triggered*, not when it *starts* — explicitly fetching the branch
      # here instead gets whatever's current by the time we actually run,
      # which is what avoids racing check.yml's own commit below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watchlist check
        run: python checker.py --watchlist-check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

      - name: Commit results
        if: success()
        run: |
          git config user.name  "hot-wheels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json docs/data.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "watchlist check $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Belt and braces on top of the fresh checkout above: if this
            # still collides with a concurrent push, don't fail the whole
            # run over one skipped commit — the next 5-minute run (or the
            # full hourly scan) will pick up the same data again shortly.
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              git push
            else
              git rebase --abort || true
              echo "::warning::Skipped commit — origin moved under us; will retry next run."
            fi
          fi
